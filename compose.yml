services:
  ocr:
    build: .
    image: repo-demo-ocr:latest
    container_name: demo-ocr
    restart: unless-stopped
    # static files only; the OCR runs in the visitor's browser, not here
    mem_limit: 128m
    environment:
      - PORT=3101
    # loopback only — Docker publishes past ufw, so a bare "3101:3101" would be public
    ports:
      - "127.0.0.1:3101:3101"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
